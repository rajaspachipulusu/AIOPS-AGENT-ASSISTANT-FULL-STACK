networks:
  aiops-net:
    driver: bridge

volumes:
  postgres_data:

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: aiops
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: aiops_dev_pw
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432" # host 5433 to avoid clashing with the local brew postgres on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops -d aiops"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aiops-net

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://aiops:aiops_dev_pw@postgres:5432/aiops
      READONLY_DATABASE_URL: postgresql+psycopg2://aiops_reader:readonly_dev_pw@postgres:5432/aiops
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      DEMO_USERNAME: ${DEMO_USERNAME:-admin}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-changeme123}
      # host.containers.internal is Podman's (and Docker Desktop's) DNS name
      # for reaching services running on the host machine — used here since
      # Ollama runs on the host, not inside a container.
      OLLAMA_BASE_URL: http://host.containers.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - aiops-net

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - aiops-net
